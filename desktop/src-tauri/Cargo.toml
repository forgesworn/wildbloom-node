[package]
name = "wildbloom-desktop"
version = "0.3.5"
description = "Wildbloom Node desktop tray application"
authors = ["ForgeSworn"]
license = "MIT"
repository = "https://github.com/forgesworn/wildbloom-node"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

[workspace]

[features]
native-acceptance = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
wildbloom-private-state = { path = "../../crates/private-state" }
wildbloom-envelope = { path = "../../crates/envelope" }
getrandom = "0.3.4"
hkdf = "=0.12.4"
keyring = "=4.2.0"
nostr = { version = "=0.45.4", features = ["os-rng"] }
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "2.0.17"
url = "2.5.7"
# Wildbloom Drop: Foregather live pairing (exact release tag), NIP-46 approval,
# the private SQLite file index and HTTP body streaming.
foregather-kit = { git = "https://github.com/forgesworn/foregather-kit", tag = "v0.4.0", features = ["experimental-live"] }
nostr-connect = { version = "=0.45.2", default-features = false, features = ["aws_lc_rs", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
futures-util = "0.3.31"
bytes = "1.10.1"
base64 = "0.22.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
# One process-wide TLS provider: the updater and reqwest compile both ring and
# aws-lc-rs, so the default is installed explicitly at start-up.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
zeroize = "1.9.0"
fs2 = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-positioner = { version = "=2.3.4", features = ["tray-icon"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1.48.0", features = ["sync", "time", "process", "io-util", "macros", "fs", "rt-multi-thread", "net"] }
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[package]
name = "wildbloom-desktop"
version = "0.3.5"
description = "Wildbloom Node desktop tray application"
authors = ["ForgeSworn"]
license = "MIT"
repository = "https://github.com/forgesworn/wildbloom-node"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

[workspace]

[features]
native-acceptance = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
wildbloom-private-state = { path = "../../crates/private-state" }
wildbloom-envelope = { path = "../../crates/envelope" }
getrandom = "=0.3.4"
hkdf = "=0.12.4"
keyring = "=4.2.0"
nostr = { version = "=0.45.4", features = ["os-rng"] }
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.20"
url = "=2.5.8"
zeroize = "=1.9.0"
fs2 = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1.48.0", features = ["sync", "time", "process", "io-util", "macros"] }
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

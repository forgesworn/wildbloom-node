[package]
name = "wildbloom-envelope"
description = "Streaming FSWNENC2 envelope shared by the Wildbloom daemon and desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# The cryptographic crates are pinned exactly and match stash-rs, whose FSWNENC2
# frame this crate is extracted from: aes-gcm 0.10, hkdf 0.12 and the digest-0.10
# sha2.  General-purpose crates follow the workspace's caret convention.
[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }
# Not used directly: enables wiping of the AES key schedule and GHASH key.
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
hkdf = "=0.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "=0.10.9", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
unicode-normalization = "0.1.25"
wildbloom-private-state = { path = "../private-state" }
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"

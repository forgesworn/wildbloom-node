[package]
name = "wildbloom-envelope"
description = "Streaming FSWNENC2 envelope shared by the Wildbloom daemon and desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# The cryptographic family matches stash-rs, whose FSWNENC2 frame this crate is
# extracted from: aes-gcm 0.10, hkdf 0.12 and the digest-0.10 sha2.
[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
getrandom = "=0.3.4"
hkdf = "=0.12.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
wildbloom-private-state = { path = "../private-state" }
zeroize = "=1.9.0"

[dev-dependencies]
hex = "=0.4.3"

[workspace]
members = ["crates/wildbloom-core", "crates/wildbloomd"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ForgeSworn"]
repository = "https://github.com/forgesworn/wildbloom-node"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
http = "1.3.1"
http-body-util = "0.1.3"
libc = "0.2.189"
nostr = { version = "0.45.3", features = ["os-rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "socks"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[workspace]
members = ["crates/wildbloomd"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ForgeSworn"]
repository = "https://github.com/forgesworn/wildbloom-node"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
directories = "6.0.0"
hex = "0.4.3"
libc = "0.2.189"
nostr = { version = "0.45.3", features = ["os-rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
wildbloom-core = { package = "shelter-kit", git = "https://github.com/forgesworn/shelter-kit", tag = "v0.4.1" }

name: Signed desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact source version, without a v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  TOR_EXPERT_BUNDLE_VERSION: 15.0.20

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tor: linux-x86_64
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            tor: macos-aarch64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            tor: macos-x86_64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tor: windows-x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_TEAM_ID || '' }}
      WINDOWS_CERTIFICATE: ${{ startsWith(matrix.os, 'windows') && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.os, 'windows') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_TIMESTAMP_URL: ${{ startsWith(matrix.os, 'windows') && secrets.WINDOWS_TIMESTAMP_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse the wrong branch, version or missing signing authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.version }}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${{ inputs.version }}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)"
          test "${{ inputs.version }}" = "$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            test -n "$WINDOWS_CERTIFICATE"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
            test -n "$WINDOWS_TIMESTAMP_URL"
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gnupg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install macOS signature verification tools
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Install Windows signature verification tools
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install gnupg --yes --no-progress
      - name: Import Developer ID certificate for nested macOS code
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/wildbloom-developer-id.p12"
          keychain="$RUNNER_TEMP/wildbloom-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f -- "$certificate"
      - name: Import trusted Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'wildbloom-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows signing certificate import failed' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item -LiteralPath $certificatePath
      - name: Prepare signed upstream Tor runtime and daemon
        shell: bash
        run: |
          set -euo pipefail
          scripts/prepare-tor-runtime.sh "${{ matrix.tor }}" desktop/src-tauri/tor-runtime
          cargo build --locked --release --target "${{ matrix.target }}" -p wildbloomd
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/wildbloomd.exe" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/wildbloomd" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}"
          fi
      - name: Write target-specific production signing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            jq -n --arg identity "$APPLE_SIGNING_IDENTITY" \
              '{bundle:{createUpdaterArtifacts:true,macOS:{signingIdentity:$identity}}}' \
              > desktop/src-tauri/tauri.production.conf.json
          elif [ "$RUNNER_OS" = "Windows" ]; then
            jq -n --arg thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT" --arg timestamp "$WINDOWS_TIMESTAMP_URL" \
              '{bundle:{createUpdaterArtifacts:true,windows:{certificateThumbprint:$thumbprint,digestAlgorithm:"sha256",timestampUrl:$timestamp,tsp:false}}}' \
              > desktop/src-tauri/tauri.production.conf.json
          else
            jq -n '{bundle:{createUpdaterArtifacts:true}}' \
              > desktop/src-tauri/tauri.production.conf.json
          fi
      - name: Sign nested macOS Tor code with Developer ID
        if: runner.os == 'macOS'
        run: scripts/sign-macos-tor-runtime.sh "$APPLE_SIGNING_IDENTITY" desktop/src-tauri/tor-runtime
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tagName: v__VERSION__
          releaseName: Wildbloom Node v__VERSION__
          releaseBody: Signed release candidate.  Keep this release in draft until the clean-machine gate in docs/RELEASE.md is complete.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config tauri.production.conf.json
      - name: Verify updater signatures were emitted
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.sig' -print -quit)"
      - name: Verify macOS signature and notarisation ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = Get-ChildItem "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw 'No Windows installer was produced' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($file.FullName) ($($signature.Status))" }
          }

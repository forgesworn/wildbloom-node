name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-ui:
    name: Desktop pool controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --prefix desktop
      - run: npm exec --offline -- playwright-core install --with-deps chromium
        working-directory: desktop
      - run: npm test --prefix desktop

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    # Keep the required-check name stable; this also runs native lifecycle tests.
    name: Desktop compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11
      - name: Prepare host daemon sidecar
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | awk '/^host:/ { print $2 }')"
          cargo build --locked --release -p wildbloomd
          mkdir -p desktop/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/wildbloomd.exe "desktop/src-tauri/binaries/wildbloomd-${target}.exe"
          else
            cp target/release/wildbloomd "desktop/src-tauri/binaries/wildbloomd-${target}"
          fi
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Native desktop pool lifecycle
        timeout-minutes: 15
        shell: bash
        env:
          WILDBLOOM_NATIVE_EVIDENCE: ${{ runner.temp }}/native-pool-lifecycle.json
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- node scripts/accept-desktop-native.mjs
          else
            node scripts/accept-desktop-native.mjs
          fi
      - name: Retain native pool evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ runner.os }}-pool-lifecycle
          path: ${{ runner.temp }}/native-pool-lifecycle.json
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: scripts/audit-dependencies.sh

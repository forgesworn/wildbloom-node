name: Desktop preview installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOR_EXPERT_BUNDLE_VERSION: 15.0.20

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tor: linux-x86_64
            bundles: deb,rpm
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            tor: macos-aarch64
            bundles: app,dmg
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            tor: macos-x86_64
            bundles: app,dmg
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tor: windows-x86_64
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gnupg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install macOS signature verification tools
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Use Windows runner signature verification tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -x /c/msys64/usr/bin/gpg.exe
          test -x /c/msys64/usr/bin/gpgv.exe
          printf '%s\n' \
            'WILDBLOOM_GPG_BIN=/c/msys64/usr/bin/gpg.exe' \
            'WILDBLOOM_GPGV_BIN=/c/msys64/usr/bin/gpgv.exe' \
            'WILDBLOOM_GPG_PATH_STYLE=windows' \
            >> "$GITHUB_ENV"
      - name: Prepare signed upstream Tor runtime and daemon
        shell: bash
        run: |
          set -euo pipefail
          scripts/prepare-tor-runtime.sh "${{ matrix.tor }}" desktop/src-tauri/tor-runtime
          cargo build --locked --release --target "${{ matrix.target }}" -p wildbloomd
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/wildbloomd.exe" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/wildbloomd" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}"
          fi
      - name: Ad-hoc sign nested macOS Tor code for preview execution
        if: runner.os == 'macOS'
        run: scripts/sign-macos-tor-runtime.sh - desktop/src-tauri/tor-runtime
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          args: --verbose --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbloom-node-${{ matrix.target }}-unsigned-preview
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

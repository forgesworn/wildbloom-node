name: Desktop preview installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOR_EXPERT_BUNDLE_VERSION: 15.0.21

jobs:
  tor-inputs:
    name: Verify pinned Tor downloads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download once and verify each upstream bundle
        shell: bash
        run: |
          set -euo pipefail
          export WILDBLOOM_TOR_CACHE_DIR="$RUNNER_TEMP/verified-tor-downloads"
          for platform in linux-x86_64 macos-aarch64 macos-x86_64 windows-x86_64; do
            scripts/prepare-tor-runtime.sh "$platform" "$RUNNER_TEMP/tor-$platform"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-tor-downloads
          path: ${{ runner.temp }}/verified-tor-downloads
          if-no-files-found: error
          retention-days: 1

  build:
    needs: tor-inputs
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tor: linux-x86_64
            bundles: deb,rpm
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            tor: macos-aarch64
            bundles: app,dmg
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            tor: macos-x86_64
            bundles: app,dmg
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tor: windows-x86_64
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          dbus-x11 gnupg jq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf xvfb
      - name: Install macOS signature verification tools
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Use Windows runner signature verification tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -x /c/msys64/usr/bin/gpg.exe
          test -x /c/msys64/usr/bin/gpgv.exe
          printf '%s\n' \
            'WILDBLOOM_GPG_BIN=/c/msys64/usr/bin/gpg.exe' \
            'WILDBLOOM_GPGV_BIN=/c/msys64/usr/bin/gpgv.exe' \
            'WILDBLOOM_GPG_PATH_STYLE=windows' \
            >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-tor-downloads
          path: ${{ runner.temp }}/verified-tor-downloads
      - name: Prepare signed upstream Tor runtime and daemon
        shell: bash
        env:
          WILDBLOOM_TOR_DOWNLOAD_DIR: ${{ runner.temp }}/verified-tor-downloads
        run: |
          set -euo pipefail
          scripts/prepare-tor-runtime.sh "${{ matrix.tor }}" desktop/src-tauri/tor-runtime
          cargo build --locked --release --target "${{ matrix.target }}" -p wildbloomd
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/wildbloomd.exe" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/wildbloomd" \
              "desktop/src-tauri/binaries/wildbloomd-${{ matrix.target }}"
          fi
      - name: Ad-hoc sign nested macOS Tor code for preview execution
        if: runner.os == 'macOS'
        run: scripts/sign-macos-tor-runtime.sh - desktop/src-tauri/tor-runtime
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          args: --verbose --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Install and exercise the Linux package
        if: runner.os == 'Linux'
        run: scripts/accept-desktop-linux.sh "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
      - name: Install and exercise the macOS package against the signed baseline
        if: runner.os == 'macOS'
        run: |
          python3 scripts/accept-desktop-macos-bundle.py \
            --bundle "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" \
            --candidate-adhoc --output "$RUNNER_TEMP/macos-install.json"
      - name: Retain macOS installation evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-install-${{ matrix.target }}
          path: ${{ runner.temp }}/macos-install.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install and exercise the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/accept-desktop-windows.ps1 "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbloom-node-${{ matrix.target }}-unsigned-preview
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          # Unsigned previews for a look, not the signed artefacts a release
          # publishes. The default 90 days made this the largest consumer of
          # the account's Actions storage at 4.55 GB.
          retention-days: 7
